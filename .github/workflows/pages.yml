# Builds the site with the Gemfile's Jekyll (4.x) and our own _plugins, then deploys to GitHub Pages.
# The legacy Pages builder runs Jekyll 3 in safe mode and silently skips _plugins/,
# which is why the per-post .md alternates (post_md_emitter.rb) never shipped before this.
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check the LLM alternates were emitted
        run: |
          count=$(find _site -maxdepth 1 -name '*.md' | wc -l)
          echo "Markdown alternates: $count"
          test "$count" -gt 0

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
